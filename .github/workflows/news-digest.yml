name: Update the MyNews feed

on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: mynews-news-digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the protected news processor
        env:
          CRON_SECRET: ${{ secrets.MYNEWS_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "MYNEWS_CRON_SECRET is not configured yet; skipping this run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 270 --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Length: 0" \
            https://my-news-two-liard.vercel.app/api/ingest
